[functions.send-notification]
# DFL uses its existing member + commissioner headers rather than Supabase Auth.
# The function verifies those headers with has_commissioner_permission() before
# any send; config requests reveal only the public VAPID key.
verify_jwt = false

[functions.sync-sleeper]
# The scheduled request carries a dedicated secret header stored in Vault.
verify_jwt = false

[functions.sync-sportsbook-feed]
# Authorization is re-checked against DFL commissioner permissions, or the
# scheduled job's dedicated token. The provider key never reaches the browser.
verify_jwt = false

[functions.roster-advice]
# The worker accepts only the existing Vault cron token, checked by SHA-256.
# Browsers cannot supply recommendations, timestamps or write receipts.
verify_jwt = false

# Scheduled watchlist worker checks the existing private cron token itself.
[functions.player-watchlist]
verify_jwt = false

[functions.live-football]
# The existing private scheduler token is verified before any reads or writes.
verify_jwt = false
