name: Refresh expert ROS rankings
on:
  pull_request:
    paths:
      - 'js/expert-rankings*'
      - 'data/expert-ros-ppr.json'
      - 'tools/*expert*rankings*'
      - '.github/workflows/expert-rankings-refresh.yml'
  schedule:
    - cron: '17 0,6,12,18 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: expert-rankings-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || 'main' }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tools -p '*rankings_test.py'
      - run: python tools/refresh-expert-rankings.py
      - name: Publish ranking snapshot
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/expert-ros-ppr.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/expert-ros-ppr.json
          git commit -m 'Refresh FantasyPros PPR rest-of-season rank facts'
          git push origin HEAD:main
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
