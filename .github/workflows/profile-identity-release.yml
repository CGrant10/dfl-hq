name: Profile identity release
on:
  push:
    paths:
      - 'js/profile-identity.js'
      - '.github/workflows/profile-identity-release.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Wire profile identity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('js/pages/profile.js')
          s=p.read_text()
          imp='import { wireDflPage } from "./profile-dfl.js";'
          add=imp+'\nimport { profileIdentityDisplay, identitySettingsCard, wireProfileIdentity } from "../profile-identity.js";'
          if 'profileIdentityDisplay' not in s:
              s=s.replace(imp,add)
          marker='''          <div class="row" style="margin-top:10px">'''
          if '${profileIdentityDisplay(m)}' not in s:
              s=s.replace(marker,'''          ${profileIdentityDisplay(m)}\n'''+marker,1)
          old='''${isMe ? `<h2 class="section-title">Settings</h2>${golfNameCard(member)}${appearanceCard()}` : ""}'''
          new='''${isMe ? `<h2 class="section-title">Settings</h2>${identitySettingsCard(member, careerStats, dfl || {}, [])}${golfNameCard(member)}${appearanceCard()}` : ""}'''
          s=s.replace(old,new)
          wire='''  wireDflPage(view, member, isMe, () => render(view));'''
          if 'wireProfileIdentity(view' not in s:
              s=s.replace(wire,wire+'''\n  if (isMe) wireProfileIdentity(view, member, () => render(view));''')
          p.write_text(s)
          PY
      - name: Bump release
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          v='1.109.69'
          Path('version.txt').write_text(v+'\n')
          p=Path('js/config.js'); s=p.read_text(); s=re.sub(r'const RELEASE_FLOOR = "[^"]+";',f'const RELEASE_FLOOR = "{v}";',s); p.write_text(s)
          p=Path('sw.js'); s=p.read_text(); s=re.sub(r'const CACHE_NAME = "dfl-hq-v[^"]+";',f'const CACHE_NAME = "dfl-hq-v{v}";',s); 
          if '"./js/profile-identity.js"' not in s: s=s.replace('"./js/profile-share.js"', '"./js/profile-share.js","./js/profile-identity.js"')
          p.write_text(s)
          p=Path('package.json'); d=json.loads(p.read_text()); d['version']=v; p.write_text(json.dumps(d,indent=2)+'\n')
          PY
      - name: Check and commit
        run: |
          npm install --ignore-scripts
          npm run check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/pages/profile.js js/profile-identity.js js/config.js sw.js version.txt package.json package-lock.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Release profile identity v1.109.69"
          git push
