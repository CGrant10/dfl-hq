name: Prepare Home week release
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  prepare:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/home-week-flow-1438'
    runs-on: ubuntu-latest
    env:
      DFL_REVIEW_DIR: ${{ github.workspace }}/home-week-review-output
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pip install playwright
      - name: Review mobile Home phases
        run: |
          export DFL_REVIEW_CHROMIUM="$(command -v google-chrome)"
          node tools/render-home-review.mjs
          python tools/capture-home-week-review.py
      - name: Save generated release and temporary review images
        run: |
          mkdir -p .codex-review
          cp "$DFL_REVIEW_DIR/week-light-390-final.png" .codex-review/home-light-final.png
          cp "$DFL_REVIEW_DIR/week-dark-390-live.png" .codex-review/home-dark-live.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- css/app-shared.css js/workers js/bundle
          git add -f -- .codex-review/home-light-final.png .codex-review/home-dark-live.png
          if ! git diff --cached --quiet; then
            git commit -m "Build Home week release and capture mobile review"
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-week-review
          path: home-week-review-output/
          retention-days: 7
