      - 'js/broadcast-depth*'
      - '.github/workflows/home-design-review.yml'

permissions:
  contents: read

jobs:
  browser-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DFL_REVIEW_DIR: ${{ github.workspace }}/home-review-output
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - name: Use the runner's installed Chrome
        run: |
          dfl_review_browser="$(command -v google-chrome)"
          test -n "$dfl_review_browser"
          printf 'DFL_REVIEW_CHROMIUM=%s\n' "$dfl_review_browser" >> "$GITHUB_ENV"
      - run: node tools/render-home-review.mjs
      - name: Check safe actionable roster advice
        run: python tools/capture-next-action-review.py
      - name: Check weekly power editions and ranking details
        run: python tools/capture-power-review.py
      - name: Check phase-aware Home weekly desk
        run: python tools/capture-home-week-review.py
      - name: Check final matchup presentation
        run: python tools/capture-finish-review.py
      - name: Check official Arena finish and factual Home stories
        env:
          DFL_FINISH_REVIEW_DIR: ${{ github.workspace }}/home-review-output/finish-stories
        run: python tools/capture-finish-stories.py
      - name: Check story-specific broadcast compositions
        run: python tools/capture-broadcast-art-direction.py
      - name: Check award artwork spacing
        run: python tools/capture-award-review.py
      - name: Check broadcast first-read timing
        run: python tools/capture-broadcast-review.py
      - name: Check mobile sheet gestures
        env:
          DFL_SHEET_REVIEW_DIR: ${{ github.workspace }}/home-review-output/sheets
        run: |
          node tools/render-sheet-review.mjs
          python tools/capture-player-card-motion.py
          python tools/capture-sheet-review.py
          python tools/capture-sportsbook-slip-review.py
      - name: Check score effects while scrolling
        env:
          DFL_SCORE_SCROLL_REVIEW_DIR: ${{ github.workspace }}/home-review-output/score-scroll
        run: python tools/capture-score-scroll-review.py
      - name: Check player comparisons
        env:
          DFL_COMPARE_REVIEW_DIR: ${{ github.workspace }}/home-review-output/comparison
        run: python tools/capture-comparison-review.py
      - name: Check mobile GameDay recap
        env:
          DFL_RECAP_REVIEW_DIR: ${{ github.workspace }}/home-review-output/recap
        run: python tools/capture-recap-review.py
      - name: Check live record chases and original team art
        env:
          DFL_RECORD_REVIEW_DIR: ${{ github.workspace }}/home-review-output/records
        run: python tools/capture-record-art-review.py
      - name: Check continuous tab glides
        env:
          DFL_TAB_REVIEW_DIR: ${{ github.workspace }}/home-review-output/tabs
        run: |
          node tools/render-tab-review.mjs
          python tools/capture-tab-review.py
      - name: Check directional page navigation
        env:
          DFL_ROUTE_REVIEW_DIR: ${{ github.workspace }}/home-review-output/routes
        run: python tools/capture-route-review.py
      - name: Check shared matchup transitions
        env:
          DFL_MATCHUP_REVIEW_DIR: home-review-output/matchup
        run: python tools/capture-matchup-review.py
      - name: Check compact mobile trade alert
        run: python tools/capture-trade-alert-review.py
        env:
          DFL_ALERT_REVIEW_DIR: home-review-output/trade-alert
      - name: Check smooth scroll controllers
        run: python tools/capture-scroll-review.py
        env:
          DFL_SCROLL_REVIEW_DIR: home-review-output/scroll
      - name: Check native and fallback Home score motion
        env:
          DFL_SCORE_REVIEW_DIR: ${{ github.workspace }}/home-review-output/score-motion
        run: python tools/capture-home-score-review.py
      - name: Check touch feedback and interrupted tab transitions
        env:
          DFL_MOTION_REVIEW_DIR: home-review-output/motion-quality
          DFL_TAB_REVIEW_DIR: ${{ github.workspace }}/home-review-output/tabs
        run: python tools/capture-motion-quality.py
      - name: Check contextual Sleeper actions on mobile
        env:
          DFL_SLEEPER_REVIEW_DIR: home-review-output/sleeper
        run: python tools/capture-sleeper-actions.py
      - name: Check full themed Home screens
        run: python tools/capture-home-review.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-design-review
          path: home-review-output/
          retention-days: 7

  arena-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - name: Check stadium controls and orientation
        env:
          DFL_ARENA_REVIEW_DIR: arena-review-output
        run: |
          export DFL_REVIEW_CHROMIUM="$(command -v google-chrome)"
          test -n "$DFL_REVIEW_CHROMIUM"
          python tools/capture-stadium-arena.py
      - name: Check character poses, silhouettes and texture reuse
        env:
          DFL_CHARACTER_REVIEW_DIR: arena-review-output/characters
        run: |
          export DFL_REVIEW_CHROMIUM="$(command -v google-chrome)"
          python tools/capture-racer-character-review.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stadium-controls-review
          path: arena-review-output/
          retention-days: 7

  arena-database:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Check race maintenance and permissions in isolated PostgreSQL
        env:
          DFL_ARENA_TEST_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$DFL_ARENA_TEST_CONTAINER" mkdir -p /qa/supabase
          docker cp arena_schema.sql "$DFL_ARENA_TEST_CONTAINER:/qa/"
          docker cp arena_broadcast_schema.sql "$DFL_ARENA_TEST_CONTAINER:/qa/"
          docker cp broadcast_items_schema.sql "$DFL_ARENA_TEST_CONTAINER:/qa/"
          docker cp supabase/migrations "$DFL_ARENA_TEST_CONTAINER:/qa/supabase/"
          docker cp supabase/tests "$DFL_ARENA_TEST_CONTAINER:/qa/supabase/"
          docker exec "$DFL_ARENA_TEST_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 -f /qa/supabase/tests/arena_fixture.sql
