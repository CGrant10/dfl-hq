name: Home design review

on:
  pull_request:
    paths:
      - 'css/app-shared.css'
      - 'css/shared-styles.json'
      - 'js/tab-scroll-cues.js'
      - 'js/ui-motion.js'
      - 'js/swipe-tabs*'
      - 'js/horizontal-swipe*'
      - 'css/ui-motion.css'
      - 'tools/*tab-review*'
      - 'js/sheet-drag*'
      - 'js/pages/sportsbook.js'
      - 'tools/*sheet-review*'
      - 'tools/build-shared-css.mjs'
      - 'js/home-presentation*'
      - 'js/season-nav*'
      - 'js/home-clubhouse*'
      - 'js/pages/home.js'
      - 'js/pages/clubhouse.js'
      - 'css/app-reading.css'
      - 'css/nav-neutral.css'
      - 'css/app-shell.css'
      - 'css/everyday-premium.css'
      - 'css/stat-presentation.css'
      - 'css/loading-polish.css'
      - 'js/loading-presentation*'
      - 'js/route-placeholder*'
      - 'js/router.js'
      - 'js/route-motion.js'
      - 'tools/*route-review*'
      - 'js/player-card*'
      - 'js/player-form*'
      - 'js/broadcast-stage.js'
      - 'js/broadcast-deck*'
      - 'js/home-slides*'
      - 'js/home-injury-panel.js'
      - 'js/injury-report-model*'
      - 'css/home-injury-panel.css'
      - 'js/score-vfx*'
      - 'css/home-broadcast-design.css'
      - 'css/home-broadcast-stories.css'
      - 'css/home-newspaper.css'
      - 'css/home-layout.css'
      - 'css/home-league-desk.css'
      - 'css/matchup-interactions.css'
      - 'js/clubhouse-matchup*'
      - 'js/clubhouse-center*'
      - 'js/clubhouse-polish.js'
      - 'css/clubhouse-polish.css'
      - 'js/game-day-lineup-comparison*'
      - 'css/game-day-watch.css'
      - 'js/weekly-clubhouse-ui.js'
      - 'js/game-day-score-motion*'
      - 'js/game-day-model*'
      - 'css/home.css'
      - 'js/sportsbook-pickem.js'
      - 'js/member-wall.js'
      - 'js/game-day.js'
      - 'js/matchup-banter*'
      - 'js/matchup-chirp-ui*'
      - 'js/clubhouse-play.js'
      - 'assets/dfl-daily-*'
      - 'tools/*home-review*'
      - '.github/workflows/home-design-review.yml'

permissions:
  contents: read

jobs:
  browser-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DFL_REVIEW_DIR: ${{ github.workspace }}/home-review-output
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - name: Use the runner's installed Chrome
        run: |
          dfl_review_browser="$(command -v google-chrome)"
          test -n "$dfl_review_browser"
          printf 'DFL_REVIEW_CHROMIUM=%s\n' "$dfl_review_browser" >> "$GITHUB_ENV"
      - run: node tools/render-home-review.mjs
      - run: python tools/capture-home-review.py
      - name: Check mobile sheet gestures
        env:
          DFL_SHEET_REVIEW_DIR: ${{ github.workspace }}/home-review-output/sheets
        run: |
          node tools/render-sheet-review.mjs
          python tools/capture-sheet-review.py
      - name: Check continuous tab glides
        env:
          DFL_TAB_REVIEW_DIR: ${{ github.workspace }}/home-review-output/tabs
        run: |
          node tools/render-tab-review.mjs
          python tools/capture-tab-review.py
      - name: Check directional page navigation
        env:
          DFL_ROUTE_REVIEW_DIR: ${{ github.workspace }}/home-review-output/routes
        run: python tools/capture-route-review.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-design-review
          path: home-review-output/
          retention-days: 7
