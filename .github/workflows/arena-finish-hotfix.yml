name: Arena spectator exit fix

on:
  push:
    branches: [main]
    paths: [.github/workflows/arena-finish-hotfix.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Stop finished Arena events from trapping spectators in Race View
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          p = Path('js/pages/arena.js')
          s = p.read_text()
          old = 'if (!event || !["running", "paused", "finished"].includes(event.bc_state)) return false;'
          new = 'if (!event || !["running", "paused"].includes(event.bc_state)) return false;'
          if old not in s:
              raise SystemExit('Arena spectator redirect anchor not found')
          s = s.replace(old, new, 1)
          s = s.replace(
              'function enterSharedRace(event) {\n  if (!event || !["running", "paused"].includes(event.bc_state)) return false;',
              'function enterSharedRace(event) {\n  /* Only a LIVE race owns the spectator screen. A finished race belongs back\n     on the Arena event page so Exit works and members can read the saved\n     results instead of being redirected straight back into Broadcast. */\n  if (!event || !["running", "paused"].includes(event.bc_state)) return false;',
              1)
          p.write_text(s)

          VERSION = '1.109.58'
          Path('version.txt').write_text(VERSION + '\n')

          pkg = json.loads(Path('package.json').read_text())
          pkg['version'] = VERSION
          Path('package.json').write_text(json.dumps(pkg, indent=2) + '\n')

          sw = Path('sw.js')
          x = sw.read_text()
          x, n = re.subn(r'const CACHE_NAME = "dfl-hq-v[^"]+";',
                         f'const CACHE_NAME = "dfl-hq-v{VERSION}";', x, count=1)
          if n != 1: raise SystemExit('service worker version anchor not found')
          sw.write_text(x)

          idx = Path('index.html')
          x = idx.read_text()
          x, n = re.subn(r'name="dfl-app-version" content="[^"]+"',
                         f'name="dfl-app-version" content="{VERSION}"', x, count=1)
          if n != 1: raise SystemExit('HTML version anchor not found')
          idx.write_text(x)

          cfg = Path('js/config.js')
          x = cfg.read_text()
          x, n = re.subn(r'const RELEASE_FLOOR = "1\.109\.\d+";',
                         f'const RELEASE_FLOOR = "{VERSION}";', x, count=1)
          if n != 1: raise SystemExit('release floor anchor not found')
          cfg.write_text(x)
          PY
      - name: Verify
        run: pnpm check
      - name: Commit release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/pages/arena.js js/config.js version.txt package.json sw.js index.html
          git commit -m "Let Arena spectators exit finished races and release v1.109.58"
          git push
