name: Historical identity hotfix

on:
  push:
    branches: [main]
    paths: [.github/workflows/arena-finish-hotfix.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Preserve 2019 champion identity and bump release
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          p = Path('js/sync.js')
          s = p.read_text()
          needle = '''  const lastPlaceRoster = readLastPlace(losers);\n'''
          insert = '''  const lastPlaceRoster = readLastPlace(losers);\n\n  /*\n    ONE KNOWN ORPHANED IDENTITY.\n\n    sheyg2014 won 2019 and was removed from that Sleeper league afterward, so\n    the API now returns no owner for his roster. The champion roster itself is\n    still authoritative. Repair only that exact season+roster snapshot after\n    every sync; never rename generic deleted users.\n  */\n  if (season === 2019 && championRoster != null) {\n    const historicalName = "sheyg2014";\n    const [rosterFix, standingsFix] = await Promise.all([\n      db().from("sleeper_rosters")\n        .update({ team_name: historicalName, display_name: historicalName })\n        .eq("season", season).eq("roster_id", championRoster),\n      db().from("sleeper_standings")\n        .update({ team_name: historicalName })\n        .eq("season", season).eq("roster_id", championRoster),\n    ]);\n    if (rosterFix.error) throw rosterFix.error;\n    if (standingsFix.error) throw standingsFix.error;\n    log(`   restored ${season} champion identity: ${historicalName}`);\n  }\n'''
          if 'restored ${season} champion identity: ${historicalName}' not in s:
              if needle not in s: raise SystemExit('sync insertion point not found')
              s = s.replace(needle, insert, 1)
          p.write_text(s)

          p = Path('js/lore.js')
          s = p.read_text()
          needle = '''    // No owner: the Sleeper account was deleted. Use that season's team\n    // name if we captured one, otherwise at least identify the roster, so\n    // the season still appears instead of vanishing.\n    const orphan = season != null && rosterId != null\n'''
          replacement = '''    // One known historical orphan: Sleeper lost the owner account after the\n    // 2019 champion left the league, but the champion roster is still known.\n    // Scope this to that exact roster so other deleted accounts remain honest.\n    const known2019Champion = season === 2019 && rosterId != null &&\n      (data.leagues || []).some((l) => Number(l.season) === 2019 &&\n        String(l.champion_roster_id) === String(rosterId));\n    if (known2019Champion) return { label: "sheyg2014", sub: "", memberId: null };\n\n    // No owner: the Sleeper account was deleted. Use that season's team\n    // name if we captured one, otherwise at least identify the roster, so\n    // the season still appears instead of vanishing.\n    const orphan = season != null && rosterId != null\n'''
          if 'known2019Champion' not in s:
              if needle not in s: raise SystemExit('lore insertion point not found')
              s = s.replace(needle, replacement, 1)
          p.write_text(s)

          VERSION = '1.109.57'
          Path('version.txt').write_text(VERSION + '\n')

          pkg = json.loads(Path('package.json').read_text())
          pkg['version'] = VERSION
          Path('package.json').write_text(json.dumps(pkg, indent=2) + '\n')

          sw = Path('sw.js')
          x = sw.read_text()
          x, n = re.subn(r'const CACHE_NAME = "dfl-hq-v[^"]+";',
                         f'const CACHE_NAME = "dfl-hq-v{VERSION}";', x, count=1)
          if n != 1: raise SystemExit('service worker version anchor not found')
          sw.write_text(x)

          idx = Path('index.html')
          x = idx.read_text()
          x, n = re.subn(r'name="dfl-app-version" content="[^"]+"',
                         f'name="dfl-app-version" content="{VERSION}"', x, count=1)
          if n != 1: raise SystemExit('HTML version anchor not found')
          idx.write_text(x)

          cfg = Path('js/config.js')
          x = cfg.read_text()
          x, n = re.subn(r'const RELEASE_FLOOR = "1\.109\.\d+";',
                         f'const RELEASE_FLOOR = "{VERSION}";', x, count=1)
          if n != 1: raise SystemExit('release floor anchor not found')
          cfg.write_text(x)
          PY
      - name: Verify
        run: pnpm check
      - name: Commit release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/sync.js js/lore.js js/config.js version.txt package.json sw.js index.html
          git commit -m "Preserve sheyg2014 as 2019 champion and release v1.109.57"
          git push
