name: DFL legacy season-count release

on:
  push:
    branches: [main]
    paths: [.github/workflows/arena-finish-hotfix.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply DFL season-count rule
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          # One source of truth: DFL existed for two seasons before the synced
          # Sleeper record begins. This adjusts DISPLAYED league-tenure counts
          # only; it never fabricates wins, points, finishes, or season rows.
          p = Path('js/config.js')
          s = p.read_text()
          needle = 'export const FIRST_SYNCED_SEASON = 2019;\n'
          addition = '''export const FIRST_SYNCED_SEASON = 2019;\nexport const LEGACY_SEASONS = Math.max(0, FIRST_SYNCED_SEASON - LEAGUE_FOUNDED);\nexport const dflSeasonCount = (syncedSeasons = 0) =>\n  Math.max(0, Number(syncedSeasons) || 0) + LEGACY_SEASONS;\n'''
          if 'export const LEGACY_SEASONS' not in s:
              if needle not in s: raise SystemExit('config season anchor not found')
              s = s.replace(needle, addition, 1)
          p.write_text(s)

          p = Path('js/pages/profile.js')
          s = p.read_text()
          s = s.replace(
              'import { FIRST_SYNCED_SEASON } from "../config.js";',
              'import { FIRST_SYNCED_SEASON, dflSeasonCount } from "../config.js";', 1)
          s = s.replace('${careerCard(careerStats, seasons.length)}',
                        '${careerCard(careerStats, dflSeasonCount(seasons.length))}', 1)
          s = s.replace('seasonCount: seasons.length,',
                        'seasonCount: dflSeasonCount(seasons.length),', 1)
          p.write_text(s)

          p = Path('js/pages/history.js')
          s = p.read_text()
          old = 'import { LEAGUE_FOUNDED, FIRST_SYNCED_SEASON } from "../config.js";'
          new = 'import { LEAGUE_FOUNDED, FIRST_SYNCED_SEASON, dflSeasonCount } from "../config.js";'
          if old in s: s = s.replace(old, new, 1)
          s = s.replace(
              'const seasonCount = new Set(data.standings.map((s) => s.season)).size;',
              'const seasonCount = dflSeasonCount(new Set(data.standings.map((s) => s.season)).size);', 1)
          p.write_text(s)

          VERSION = '1.109.55'
          Path('version.txt').write_text(VERSION + '\n')

          pkg = json.loads(Path('package.json').read_text())
          pkg['version'] = VERSION
          Path('package.json').write_text(json.dumps(pkg, indent=2) + '\n')

          sw = Path('sw.js')
          x = sw.read_text()
          import re
          x, n = re.subn(r'const CACHE_NAME = "dfl-hq-v[^"]+";',
                         f'const CACHE_NAME = "dfl-hq-v{VERSION}";', x, count=1)
          if n != 1: raise SystemExit('service worker version anchor not found')
          sw.write_text(x)

          idx = Path('index.html')
          x = idx.read_text()
          x, n = re.subn(r'name="dfl-app-version" content="[^"]+"',
                         f'name="dfl-app-version" content="{VERSION}"', x, count=1)
          if n != 1: raise SystemExit('HTML version anchor not found')
          idx.write_text(x)
          PY
      - name: Verify
        run: pnpm check
      - name: Commit release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/config.js js/pages/profile.js js/pages/history.js version.txt package.json sw.js index.html
          git commit -m "Use full DFL tenure in career season counts and release v1.109.55"
          git push
