name: Guarded v1.109.69 release

on:
  push:
    branches: [main]
    paths: [.github/workflows/arena-finish-hotfix.yml]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build release candidate
        run: |
          git fetch origin feat/profile-identity-cleanup
          git checkout origin/feat/profile-identity-cleanup -- js/profile-identity.js js/pages/profile-dfl.js

          python3 - <<'PY'
          from pathlib import Path
          import json, re

          # Arena: presets keep their exact current 900ms theatre close.
          # Custom races longer than the long preset get a proportionally
          # longer closing window so a 60s race does not spend its last beat
          # visually parked near the stripe waiting for truth to catch up.
          p = Path('src/arena/theatre.ts')
          s = p.read_text()
          old = '''export function closingEase(msToFinish: number): number {
            if (msToFinish <= 0) return 0;
            if (msToFinish >= CLOSE_MS) return 1;
            return smoothstep(msToFinish / CLOSE_MS);
          }'''
          new = '''export function closingEase(msToFinish: number, windowMs = CLOSE_MS): number {
            const window = Math.max(1, windowMs);
            if (msToFinish <= 0) return 0;
            if (msToFinish >= window) return 1;
            return smoothstep(msToFinish / window);
          }

          /**
           * Keep the three shipped presets byte-for-byte on their established
           * finish feel. A custom race longer than Long scales the theatre close
           * with its duration instead of cramming the same correction into 900ms.
           */
          export function closingWindowMs(ticks: number): number {
            const rounded = Math.round(Number(ticks) || 0);
            if (rounded === 300 || rounded === 550 || rounded === 900) return CLOSE_MS;
            return Math.max(CLOSE_MS, Math.min(2400, rounded));
          }'''
          if old not in s:
            raise SystemExit('closingEase anchor not found')
          s = s.replace(old, new, 1)

          old_gate = 'const gate = launchEase(truth) * closingEase(finishMs - t * TICK_MS) * openEase(truth);'
          new_gate = 'const gate = launchEase(truth) * closingEase(finishMs - t * TICK_MS, closeMs) * openEase(truth);'
          if old_gate not in s:
            raise SystemExit('theatre gate anchor not found')
          s = s.replace('  const finishOf = new Map(sim.order.map((o) => [o.index, o.finishMs]));',
                        '  const finishOf = new Map(sim.order.map((o) => [o.index, o.finishMs]));\n  const closeMs = closingWindowMs(sim.ticks);', 1)
          s = s.replace(old_gate, new_gate, 1)
          p.write_text(s)

          # Broadcast commissioner bar: preserve button tap targets; just stop
          # the black pill padding/gap from ballooning on a large fullscreen view.
          p = Path('css/broadcast.css')
          s = p.read_text()
          old = '''  gap: .6vw;
            padding: .7vw .9vw;'''
          new = '''  gap: clamp(4px, .35vw, 8px);
            padding: clamp(4px, .35vw, 7px) clamp(6px, .5vw, 10px);'''
          if old not in s:
            raise SystemExit('broadcast bar spacing anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # Profile identity module is now imported by profile-dfl.js, so make
          # sure the service worker knows about it on installed devices.
          p = Path('sw.js')
          s = p.read_text()
          if '"./js/profile-identity.js"' not in s:
            s = s.replace('"./js/profile-share.js"', '"./js/profile-share.js","./js/profile-identity.js"')
          p.write_text(s)

          # One synchronized release. Keep the release floor aligned too.
          v = '1.109.69'
          Path('version.txt').write_text(v + '\n')

          p = Path('package.json')
          data = json.loads(p.read_text())
          data['version'] = v
          p.write_text(json.dumps(data, indent=2) + '\n')

          p = Path('sw.js')
          s = p.read_text()
          s, n = re.subn(r'const CACHE_NAME = "dfl-hq-v[^"]+";', f'const CACHE_NAME = "dfl-hq-v{v}";', s, count=1)
          if n != 1: raise SystemExit('service worker version anchor not found')
          p.write_text(s)

          p = Path('index.html')
          s = p.read_text()
          s, n = re.subn(r'name="dfl-app-version" content="[^"]+"', f'name="dfl-app-version" content="{v}"', s, count=1)
          if n != 1: raise SystemExit('index version anchor not found')
          p.write_text(s)

          p = Path('js/config.js')
          s = p.read_text()
          s, n = re.subn(r'const RELEASE_FLOOR = "[^"]+";', f'const RELEASE_FLOOR = "{v}";', s, count=1)
          if n != 1: raise SystemExit('release floor anchor not found')
          p.write_text(s)
          PY

      - name: Verify release candidate
        run: |
          pnpm check
          grep -q 'Favorite NFL team' js/profile-identity.js
          ! grep -q 'Waiver Wire Goblin' js/profile-identity.js
          ! grep -q 'data-pet-color' js/pages/profile-dfl.js
          grep -q 'closingWindowMs(sim.ticks)' src/arena/theatre.ts
          grep -q 'clamp(4px, .35vw, 8px)' css/broadcast.css
          test "$(cat version.txt)" = "1.109.69"
          grep -q '"version": "1.109.69"' package.json
          grep -q 'dfl-hq-v1.109.69' sw.js
          grep -q 'dfl-app-version" content="1.109.69"' index.html

      - name: Commit verified release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/arena/theatre.ts css/broadcast.css js/profile-identity.js js/pages/profile-dfl.js js/config.js version.txt package.json sw.js index.html
          git commit -m "Release profile cleanup and custom Arena finish v1.109.69"
          git push
