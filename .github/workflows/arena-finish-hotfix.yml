name: Arena forward-only physics release
# trigger: duck-style-forward-physics-v1.109.62

on:
  push:
    branches: [main]
    paths: [.github/workflows/arena-finish-hotfix.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Replace Arena race physics with forward-only movement
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          # Shared race entry point: every caller (Broadcast, Arena controls,
          # replay/results) gets the same forward-only simulation.
          p = Path('js/arena/race.js')
          s = p.read_text()
          if 'import { simulateForwardRace } from "./duck-physics.js";' not in s:
              anchor = '/** Deterministic RNG (mulberry32). Same seed, same race, every time. */'
              if anchor not in s: raise SystemExit('race import anchor not found')
              s = s.replace(anchor,
                  'import { simulateForwardRace } from "./duck-physics.js";\n\n' + anchor, 1)

          old_decl = 'export function simulate(racers, ticks, seed) {'
          if old_decl in s:
              s = s.replace(old_decl, 'function simulateLegacy(racers, ticks, seed) {', 1)
              insert_at = 'function simulateLegacy(racers, ticks, seed) {'
              s = s.replace(insert_at,
                  'export function simulate(racers, ticks, seed) {\n'
                  '  return simulateForwardRace(racers, ticks, seed);\n'
                  '}\n\n'
                  + insert_at, 1)
          elif 'return simulateForwardRace(racers, ticks, seed);' not in s:
              raise SystemExit('simulate replacement anchor not found')

          # The theatre is now reactions only. No second position timeline.
          old_export = 'export { dramatize, crossingSpeeds } from "./pixi-runtime.js";'
          new_export = '''export { crossingSpeeds } from "./pixi-runtime.js";
export function dramatize(sim) {
  return { shown: sim.samples, events: [] };
}'''
          if old_export in s:
              s = s.replace(old_export, new_export, 1)
          elif 'return { shown: sim.samples, events: [] };' not in s:
              raise SystemExit('dramatize replacement anchor not found')
          p.write_text(s)

          # Broadcast explicitly uses raw samples as the drawn positions too.
          p = Path('js/pages/broadcast.js')
          s = p.read_text()
          s = s.replace('live.shown = drama.shown;', 'live.shown = live.sim.samples;', 1)
          p.write_text(s)

          VERSION = '1.109.62'
          Path('version.txt').write_text(VERSION + '\n')

          pkg = json.loads(Path('package.json').read_text())
          pkg['version'] = VERSION
          Path('package.json').write_text(json.dumps(pkg, indent=2) + '\n')

          sw = Path('sw.js')
          x = sw.read_text()
          x, n = re.subn(r'const CACHE_NAME = "dfl-hq-v[^"]+";',
                         f'const CACHE_NAME = "dfl-hq-v{VERSION}";', x, count=1)
          if n != 1: raise SystemExit('service worker version anchor not found')
          sw.write_text(x)

          idx = Path('index.html')
          x = idx.read_text()
          x, n = re.subn(r'name="dfl-app-version" content="[^"]+"',
                         f'name="dfl-app-version" content="{VERSION}"', x, count=1)
          if n != 1: raise SystemExit('HTML version anchor not found')
          idx.write_text(x)

          cfg = Path('js/config.js')
          x = cfg.read_text()
          x, n = re.subn(r'const RELEASE_FLOOR = "1\.109\.\d+";',
                         f'const RELEASE_FLOOR = "{VERSION}";', x, count=1)
          if n != 1: raise SystemExit('release floor anchor not found')
          cfg.write_text(x)
          PY
      - name: Verify
        run: pnpm check
      - name: Commit release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/arena/race.js js/arena/duck-physics.js js/pages/broadcast.js js/config.js version.txt package.json sw.js index.html
          git commit -m "Use forward-only Arena physics and release v1.109.62"
          git push
