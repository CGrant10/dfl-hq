name: Arena visible-position physics release

on:
  push:
    branches: [main]
    paths: [.github/workflows/arena-finish-hotfix.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Make visible racer position authoritative
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          p = Path('js/pages/broadcast.js')
          s = p.read_text()
          old = '''      const drama = dramatize(live.sim, Number(row.seed) || 1);\n      live.shown = drama.shown;\n      live.events = drama.events;\n      live.visuals = visualEvents(live.sim, live.shown, racers);'''
          new = '''      const drama = dramatize(live.sim, Number(row.seed) || 1);\n      /*\n        WHAT YOU SEE IS THE RACE.\n\n        Theatre may still add reactions/callouts, but it no longer owns a\n        second position track. The deterministic simulation samples are the\n        positions drawn on screen, and finishMs is recorded from the exact\n        interpolated tick where that same progress reaches 1.0. Therefore a\n        racer can never visually arrive at the stripe and wait for a separate\n        hidden finish clock: reaching the visible line IS the finish.\n      */\n      live.shown = live.sim.samples;\n      live.events = drama.events;\n      live.visuals = visualEvents(live.sim, live.shown, racers);'''
          if old not in s:
              raise SystemExit('broadcast theatre-position anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          VERSION = '1.109.61'
          Path('version.txt').write_text(VERSION + '\n')

          pkg = json.loads(Path('package.json').read_text())
          pkg['version'] = VERSION
          Path('package.json').write_text(json.dumps(pkg, indent=2) + '\n')

          sw = Path('sw.js')
          x = sw.read_text()
          x, n = re.subn(r'const CACHE_NAME = "dfl-hq-v[^"]+";',
                         f'const CACHE_NAME = "dfl-hq-v{VERSION}";', x, count=1)
          if n != 1: raise SystemExit('service worker version anchor not found')
          sw.write_text(x)

          idx = Path('index.html')
          x = idx.read_text()
          x, n = re.subn(r'name="dfl-app-version" content="[^"]+"',
                         f'name="dfl-app-version" content="{VERSION}"', x, count=1)
          if n != 1: raise SystemExit('HTML version anchor not found')
          idx.write_text(x)

          cfg = Path('js/config.js')
          x = cfg.read_text()
          x, n = re.subn(r'const RELEASE_FLOOR = "1\.109\.\d+";',
                         f'const RELEASE_FLOOR = "{VERSION}";', x, count=1)
          if n != 1: raise SystemExit('release floor anchor not found')
          cfg.write_text(x)
          PY
      - name: Verify
        run: pnpm check
      - name: Commit release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/pages/broadcast.js js/config.js version.txt package.json sw.js index.html
          git commit -m "Make Arena visible position authoritative and release v1.109.61"
          git push
