name: Prepare GameDay build
on:
  pull_request:
    paths:
      - '.github/workflows/prepare-gameday-build.yml'
permissions:
  contents: write
jobs:
  prepare:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/gameday-readiness-1437'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check
      - name: Commit verified generated release files
        env:
          DFL_BUILD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/app-shared.css js/workers js/bundle
          if ! git diff --cached --quiet; then
            git commit -m "Build verified GameDay readiness release"
            git push origin "HEAD:$DFL_BUILD_BRANCH"
          fi
          git rev-parse HEAD 'HEAD^{tree}'
