name: TypeScript migration check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Verify shipped shared styles and trade worker
        run: git diff --exit-code -- css/app-shared.css js/workers
      - name: Verify notification database filter with its production SDK
        env:
          DENO_TLS_CA_STORE: system
        run: npx --yes deno@2.5.4 test --no-config --node-modules-dir=none --no-lock --allow-import supabase/functions/tests/matchup-moments-filter_test.ts
      - name: Sync built Arena runtime
        if: github.event_name == 'push'
        run: |
          if git status --short -- js/arena | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add js/arena
            git commit -m "Sync built Arena runtime"
            git push
          fi
