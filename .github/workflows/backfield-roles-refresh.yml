name: Refresh NFL backfield roles
on:
  schedule:
    - cron: '11 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: backfield-roles-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tools -p '*backfield*test.py'
      - run: python tools/refresh-backfield-roles.py
      - name: Publish backfield facts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/backfield-roles.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/backfield-roles.json
          git commit -m 'Refresh Sleeper NFL backfield role facts'
          git pull --rebase origin main
          git push origin HEAD:main
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
