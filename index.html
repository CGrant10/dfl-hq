<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0d1117"><meta name="dfl-app-version" content="1.109.64"><title>DFL HQ</title><link rel="manifest" href="manifest.json"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="DFL HQ"><link rel="preload" href="fonts/rajdhani-700.woff2" as="font" type="font/woff2" crossorigin><link rel="stylesheet" href="css/tokens.css"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/broadcast.css"><link rel="stylesheet" href="css/golf.css"><link rel="stylesheet" href="css/ui.css"><link rel="stylesheet" href="css/screens.css"><link rel="stylesheet" href="css/marquee.css"><link rel="stylesheet" href="css/stage.css"><link rel="stylesheet" href="css/splash-loading.css"></head><body>
<script>
(function () {
  try {
    var v = localStorage.getItem("dfl.mode");
    var mode = (v === "dark" || v === "light" || v === "medicine") ? v
             : v === "system"
               ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
               : "medicine";
    var bg = mode === "light" ? "#eef1f6" : mode === "medicine" ? "#0b0b0c" : "#0d1117";
    var el = document.documentElement;
    el.setAttribute("data-mode", mode);
    el.style.setProperty("--bg", bg);
    el.style.background = bg;
    el.style.colorScheme = mode === "light" ? "light" : "dark";
  } catch (e) {}
})();
</script>
<div id="splash" aria-hidden="true" data-founded="2017"><div class="sp-inner"><img class="sp-mark" src="icons/dfl-seal-512.png" alt="" width="512" height="512" fetchpriority="high" decoding="sync"><span class="sp-season" data-sp-season></span><span class="sp-word" data-sp-word>DFL HQ</span><span class="sp-rule" aria-hidden="true"></span><span class="sp-tag" data-sp-tag>The boys. The league. The history.</span></div><span class="sp-sweep" aria-hidden="true"></span></div>
<script>
(function () {
  var el = document.getElementById("splash");
  if (!el) return;
  var force = /[?&]intro(=([a-z]+))?/.exec(location.search) || /[?&]intro(=([a-z]+))?/.exec(location.hash);
  var reduce = matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  var seen = false;
  try { seen = sessionStorage.getItem("dfl.splash.seen") === "1"; } catch (e) {}
  if (force || !seen) {
    el.classList.add("sp-show");
    try { sessionStorage.setItem("dfl.splash.seen", "1"); } catch (e) {}
  } else {
    el.remove();
  }
})();
</script>
<div id="app"></div>
<script type="module" src="js/app.js"></script>
</body></html>
