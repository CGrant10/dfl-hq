<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- user-scalable=no removes pinch to zoom, so the app does not shift around
     the way a web page does when a thumb brushes the screen -->
<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>DFL HQ</title>

<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DFL HQ">

<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!--
  ============ Icon sprite ============
  Defined once here, then referenced anywhere in the app with:
      <svg class="ico"><use href="#i-home"></use></svg>
  They are stroked with currentColor, so they take the colour of whatever
  they sit in (grey in the tab bar, green on the active tab).
  To add one: add a <symbol> with a new id and a 24x24 viewBox.
-->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="i-home" viewBox="0 0 24 24">
    <path d="M3.5 10.5 12 3.5l8.5 7M5.5 9.6V20h13V9.6M9.8 20v-5.2h4.4V20"
          fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <symbol id="i-rules" viewBox="0 0 24 24">
    <path d="M4.5 5.2A1.7 1.7 0 0 1 6.2 3.5H19v14.2H6.2A1.7 1.7 0 0 0 4.5 19.4zM4.5 19.4a1.7 1.7 0 0 0 1.7 1.7H19M8.4 7.6h6.8M8.4 11.2h6.8"
          fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <symbol id="i-keepers" viewBox="0 0 24 24">
    <rect x="4.8" y="10.2" width="14.4" height="10.3" rx="2.2"
          fill="none" stroke="currentColor" stroke-width="1.7"/>
    <path d="M8.2 10.2V7.4a3.8 3.8 0 0 1 7.6 0v2.8M12 14v2.8"
          fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
  </symbol>

  <symbol id="i-polls" viewBox="0 0 24 24">
    <path d="M4 20h16M7.2 20v-6.4M12 20V5.5M16.8 20v-9.4"
          fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
  </symbol>

  <symbol id="i-calendar" viewBox="0 0 24 24">
    <rect x="3.5" y="5.2" width="17" height="15.3" rx="2.2"
          fill="none" stroke="currentColor" stroke-width="1.7"/>
    <path d="M3.5 10h17M8.3 3.5v3.4M15.7 3.5v3.4"
          fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
  </symbol>

  <symbol id="i-history" viewBox="0 0 24 24">
    <path d="M7.4 4h9.2v3.6a4.6 4.6 0 0 1-9.2 0zM7.4 5.2H4.3v1.6a3.1 3.1 0 0 0 3.1 3.1M16.6 5.2h3.1v1.6a3.1 3.1 0 0 1-3.1 3.1M12 12.2v3.6M9.4 19.9h5.2l-.7-4.1H10z"
          fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <symbol id="i-owners" viewBox="0 0 24 24">
    <circle cx="9.3" cy="8.2" r="3.6" fill="none" stroke="currentColor" stroke-width="1.7"/>
    <path d="M3.2 20.2a6.1 6.1 0 0 1 12.2 0M16.4 4.9a3.6 3.6 0 0 1 0 6.9M18 14.6a6.1 6.1 0 0 1 2.8 5.6"
          fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
  </symbol>

  <symbol id="i-profile" viewBox="0 0 24 24">
    <circle cx="12" cy="8.3" r="3.9" fill="none" stroke="currentColor" stroke-width="1.7"/>
    <path d="M4.6 20.4a7.4 7.4 0 0 1 14.8 0"
          fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
  </symbol>

  <symbol id="i-finances" viewBox="0 0 24 24">
    <rect x="2.8" y="6.2" width="18.4" height="11.6" rx="2.2"
          fill="none" stroke="currentColor" stroke-width="1.7"/>
    <circle cx="12" cy="12" r="2.8" fill="none" stroke="currentColor" stroke-width="1.7"/>
    <path d="M6.3 9.6v4.8M17.7 9.6v4.8"
          fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
  </symbol>

  <!-- Hall of Fame category markers -->
  <symbol id="i-medal" viewBox="0 0 24 24">
    <path d="M8.2 3.5 11 9.4M15.8 3.5 13 9.4"
          fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
    <circle cx="12" cy="15.2" r="5.3" fill="none" stroke="currentColor" stroke-width="1.7"/>
  </symbol>

  <symbol id="i-award" viewBox="0 0 24 24">
    <path d="m12 3.6 2.6 5.3 5.8.8-4.2 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z"
          fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
  </symbol>

  <symbol id="i-record" viewBox="0 0 24 24">
    <path d="M4 19.5 9.5 13l3.6 3.2L20 7.5M15.6 7.5H20v4.4"
          fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <symbol id="i-moment" viewBox="0 0 24 24">
    <path d="M20.5 12.6c0 4-3.8 7.2-8.5 7.2a9.9 9.9 0 0 1-2.6-.34L4.2 21l1.3-3.7a6.7 6.7 0 0 1-2-4.7c0-4 3.8-7.2 8.5-7.2s8.5 3.2 8.5 7.2z"
          fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
  </symbol>

  <symbol id="i-admin" viewBox="0 0 24 24">
    <path d="M12 3.3 19 6v5.6c0 4.3-2.9 7.4-7 9.1-4.1-1.7-7-4.8-7-9.1V6z"
          fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
    <path d="m9.2 11.9 2 2.1 3.6-4"
          fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
</svg>

<!-- ============ Header ============ -->
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="brand-text">DFL HQ</span>
    </div>
    <button id="whoami" class="whoami" type="button" title="Your profile">
      <span id="whoami-name">…</span>
    </button>
  </div>
</header>

<!-- ============ Page content ============ -->
<main id="view" class="view" aria-live="polite"></main>

<!-- ============ Bottom navigation ============ -->
<nav class="tabbar" id="tabbar">
  <a href="#/home"     data-route="home">    <svg class="ico" aria-hidden="true"><use href="#i-home"></use></svg><span>Home</span></a>
  <a href="#/rules"    data-route="rules">   <svg class="ico" aria-hidden="true"><use href="#i-rules"></use></svg><span>Rules</span></a>
  <a href="#/keepers"  data-route="keepers"> <svg class="ico" aria-hidden="true"><use href="#i-keepers"></use></svg><span>Keepers</span></a>
  <a href="#/polls"    data-route="polls">   <svg class="ico" aria-hidden="true"><use href="#i-polls"></use></svg><span>Polls</span></a>
  <a href="#/calendar" data-route="calendar"><svg class="ico" aria-hidden="true"><use href="#i-calendar"></use></svg><span>Calendar</span></a>
  <a href="#/history"  data-route="history"> <svg class="ico" aria-hidden="true"><use href="#i-history"></use></svg><span>History</span></a>
  <a href="#/owners"   data-route="owners">  <svg class="ico" aria-hidden="true"><use href="#i-owners"></use></svg><span>Owners</span></a>
  <a href="#/finances" data-route="finances"><svg class="ico" aria-hidden="true"><use href="#i-finances"></use></svg><span>Finances</span></a>
  <a href="#/admin"    data-route="admin">   <svg class="ico" aria-hidden="true"><use href="#i-admin"></use></svg><span>Admin</span></a>
</nav>

<!-- ============ "Who are you?" member picker ============ -->
<div id="welcome" class="overlay hidden">
  <div class="overlay-card">
    <h2>Who are you?</h2>
    <p class="muted">Pick your name. No password, nothing to sign up for.</p>

    <div id="member-list" class="memberlist"></div>

    <!-- Only used when the members table is empty -->
    <form id="welcome-form" class="hidden">
      <label for="welcome-input">Your league name</label>
      <input id="welcome-input" type="text" maxlength="30" placeholder="Slaw" autocomplete="off">
      <div class="row-end"><button type="submit" class="btn">Save</button></div>
    </form>

    <div class="row-end">
      <button type="button" class="btn ghost hidden" id="welcome-cancel">Cancel</button>
    </div>
    <p class="muted tiny">Remembered on this device. You can switch any time.</p>
  </div>
</div>

<!-- ============ Add to home screen prompt ============ -->
<div id="install" class="install hidden"></div>

<div id="toast" class="toast hidden"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
