<div id="splash" aria-hidden="true"><img src="icons/crest-512.png" alt="" width="512" height="341"><span class="splash-word">DFL HQ</span></div>
<script>
/* Inline and synchronous on purpose: a splash that waits for a module to load
   is a white flash followed by a splash. It covers the app rather than
   delaying it - the app boots underneath and this removes itself.
   A launch within the last half hour is a RETURN, not a launch, so it is
   skipped entirely rather than being shown to somebody who just switched
   apps and came back. */
(function () {
  var el = document.getElementById("splash");
  if (!el) return;
  var KEY = "dfl.lastLaunch", now = Date.now(), last = 0;
  try { last = Number(localStorage.getItem(KEY)) || 0; localStorage.setItem(KEY, String(now)); } catch (e) {}
  if (now - last < 1800000) { el.classList.add("is-gone"); return; }
  el.addEventListener("animationend", function (e) {
    if (e.animationName === "dfl-splash-out") el.remove();
  });
  setTimeout(function () { if (el.parentNode) el.remove(); }, 2600);
})();
</script>
